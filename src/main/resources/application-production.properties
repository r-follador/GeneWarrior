spring.config.import=configtree:/run/secrets/
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${db-password}
spring.web.resources.static-locations=classpath:/webapp/
spring.web.resources.cache.cachecontrol.no-cache=true
spring.thymeleaf.check-template-location=false
server.forward-headers-strategy=none
genewarrior.tools.tcoffee.path=/usr/bin/t_coffee
genewarrior.tools.default-timeout=PT2M
genewarrior.tools.primer3.path=/usr/bin/primer3_core
genewarrior.tools.primer3.parameter-directory=/etc/primer3_config
