spring.application.name=genewarrior
spring.datasource.url=${GENEWARRIOR_DB_URL:jdbc:postgresql://localhost:5432/genewarrior}
spring.datasource.username=${GENEWARRIOR_DB_USER:genewarrior}
spring.datasource.password=${GENEWARRIOR_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.connect-retries=10
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
genewarrior.tools.tcoffee.path=${GENEWARRIOR_TCOFFEE_PATH:}
genewarrior.tools.primer3.path=${GENEWARRIOR_PRIMER3_PATH:}
genewarrior.tools.primer3.parameter-directory=${GENEWARRIOR_PRIMER3_PARAMETER_DIRECTORY:}
genewarrior.tools.default-timeout=PT20S
genewarrior.tools.max-input-bytes=5242880
genewarrior.tools.max-output-bytes=10485760
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
