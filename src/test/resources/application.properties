spring.datasource.url=jdbc:h2:mem:genewarrior;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
logging.level.root=INFO
genewarrior.tools.muscle.path=
genewarrior.tools.primer3.path=
genewarrior.tools.weblogo.path=
genewarrior.tools.default-timeout=PT5S
genewarrior.tools.max-input-bytes=1000000
genewarrior.tools.max-output-bytes=1000000
