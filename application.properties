# ===============================
# = DATA SOURCEconnect
# ===============================
# Set here configurations for the database connection
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.tomcat.test-while-idle=true
spring.datasource.tomcat.validation-query=SELECT 1
spring.jpa.open-in-view=false
# ===============================
# = JPA / HIBERNATE
# ===============================
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://localhost:5432/genewarrior
spring.datasource.username=${GENEWARRIOR_DB_USER:genewarrior}
spring.datasource.password=${GENEWARRIOR_DB_PASSWORD:}
logging.level.root=INFO
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.jpa.show-sql=false
website.address=http://localhost:8080
software.directory=/home/genewarrior/bin/
genewarrior.tools.muscle.path=${GENEWARRIOR_MUSCLE_PATH:/home/genewarrior/bin/muscle}
genewarrior.tools.primer3.path=${GENEWARRIOR_PRIMER3_PATH:/home/genewarrior/bin/primer3_core}
genewarrior.tools.weblogo.path=${GENEWARRIOR_WEBLOGO_PATH:/home/genewarrior/bin/weblogo}
genewarrior.tools.default-timeout=PT20S
genewarrior.tools.max-input-bytes=5242880
genewarrior.tools.max-output-bytes=10485760
