name: genewarrior

services:
  app:
    build:
      context: .
      target: runtime
    image: genewarrior:local
    platform: linux/amd64
    environment:
      SPRING_PROFILES_ACTIVE: production
      GENEWARRIOR_DB_URL: jdbc:postgresql://db:5432/genewarrior
      GENEWARRIOR_DB_USER: genewarrior
    secrets:
      - source: db-password
        target: db-password
    ports:
      - "${GENEWARRIOR_BIND_ADDRESS:-127.0.0.1}:${GENEWARRIOR_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    platform: linux/amd64
    user: postgres
    environment:
      POSTGRES_DB: genewarrior
      POSTGRES_USER: genewarrior
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [ db-password ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=3775
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U genewarrior -d genewarrior" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  db-password:
    file: ./.secrets/db-password

volumes:
  postgres-data:
